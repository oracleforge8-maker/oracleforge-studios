{% extends "base.html" %}
{% block title %}Finance{% endblock %}
{% block content %}
<div class="page-head">
    <h1>💰 Financial Metrics</h1>
    <p>API costs, revenue, and expenses tracked by The Chronicler.</p>
</div>

<div class="stat-grid">
    <div class="stat-card"><div class="stat-label">Cost</div><div class="stat-value" id="finCost">—</div></div>
    <div class="stat-card"><div class="stat-label">Revenue</div><div class="stat-value" id="finRevenue">—</div></div>
    <div class="stat-card"><div class="stat-label">Expense</div><div class="stat-value" id="finExpense">—</div></div>
    <div class="stat-card"><div class="stat-label">Net</div><div class="stat-value" id="finNet">—</div></div>
</div>

<div class="card">
    <div class="card-head"><h3>Recent Transactions</h3></div>
    <div id="finList" class="fin-list">
        <p class="muted">Loading…</p>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', async function () {
        try {
            const res = await fetch('/api/dashboard/finance');
            const data = await res.json();
            const s = data.summary || {};
            document.getElementById('finCost').textContent = '$' + (s.cost || 0).toFixed(4);
            document.getElementById('finRevenue').textContent = '$' + (s.revenue || 0).toFixed(2);
            document.getElementById('finExpense').textContent = '$' + (s.expense || 0).toFixed(2);
            document.getElementById('finNet').textContent = '$' + (s.net || 0).toFixed(4);

            const list = document.getElementById('finList');
            list.innerHTML = '';
            if (!data.recent || !data.recent.length) {
                list.innerHTML = '<p class="muted">No transactions yet.</p>';
                return;
            }
            data.recent.forEach(function (r) {
                const div = document.createElement('div');
                div.className = 'fin-item';
                div.innerHTML = '<span class="fin-type ' + r.record_type + '">' + r.record_type + '</span>' +
                    '<span class="fin-cat">' + r.category + '</span>' +
                    '<span class="fin-desc">' + (r.description || '') + '</span>' +
                    '<span class="fin-amount">$' + Number(r.amount || 0).toFixed(4) + '</span>' +
                    '<span class="fin-time">' + (r.recorded_at || '').slice(0, 16) + '</span>';
                list.appendChild(div);
            });
        } catch (err) {
            document.getElementById('finList').innerHTML = '<p class="muted">Error: ' + err + '</p>';
        }
    });
</script>
{% endblock %}
